name: Android TV Build

on:
  push:
    branches:
      - feature/apple-music-tv-r1-android9
      - feature/lx-tv-remote-source-import-r2
      - feature/lx-tv-no-update-no-platform-r3
  pull_request:
    branches:
      - feature/apple-music-tv-r1-android9
      - feature/lx-tv-no-update-no-platform-r3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 9+ APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LX-Music-TV-R3-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
