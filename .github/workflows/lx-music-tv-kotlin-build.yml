name: LX Music TV Kotlin Android build

on:
  push:
    branches:
      - feature/lx-tv-remove-hover-run238
  pull_request:
    branches:
      - feature/lx-tv-remove-hover-run238
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 17 platform
        run: |
          sdkmanager "platforms;android-37.0"
          # The SDK repository publishes API 37 under android-37.0,
          # while this project's compileSdk=37 expects the android-37 path.
          ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Kotlin Android TV debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-hover-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
