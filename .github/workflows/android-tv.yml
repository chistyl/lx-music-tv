name: LX Music TV Android Build

on:
  push:
    branches:
      - feature/lx-tv-x86-focus-r1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-37"

      - name: Validate Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK and native ABI payloads
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"
          unzip -l "$APK" | tee apk-contents.txt
          for ABI in arm64-v8a x86 x86_64; do
            if ! grep -q "lib/$ABI/" apk-contents.txt; then
              echo "Missing native libraries for ABI: $ABI"
              exit 1
            fi
          done
          mkdir -p dist
          cp "$APK" dist/LX-Music-TV-release.apk
          sha256sum dist/LX-Music-TV-release.apk | tee dist/SHA256SUMS.txt

      - name: Package complete source ZIP
        run: |
          mkdir -p dist
          zip -qr dist/LX-Music-TV-source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' './dist/*'

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LX-Music-TV-APK
          path: dist/LX-Music-TV-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LX-Music-TV-source
          path: dist/LX-Music-TV-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: LX-Music-TV-checksum
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
