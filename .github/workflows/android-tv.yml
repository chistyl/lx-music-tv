name: Android TV build

on:
  push:
    branches:
      - feature/lx-mobile-auto-source-tv-r1
      - feature/lx-tv-layout-run100
      - fix/lx-tv-theme-player-controls-run117
      - fix/lx-tv-player-spacing-theme-run130
      - fix/lx-tv-polish-run133
      - fix/lx-tv-default-language-source-name-run135
      - fix/lx-tv-remove-sync-settings-run136
      - fix/lx-tv-remove-error-log-settings-run137
      - fix/lx-tv-traditional-conversion-language-only-run138
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV project and pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply requested feature removals
        run: python3 scripts/patch-lx-tv-features.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: upstream/lx-music-mobile-auto-source/package-lock.json

      - name: Add Traditional Chinese conversion dependency
        working-directory: upstream/lx-music-mobile-auto-source
        run: npm install --package-lock-only opencc-js@1.4.2

      - name: Install JavaScript dependencies
        working-directory: upstream/lx-music-mobile-auto-source
        run: npm ci

      - name: Run upstream custom-source tests
        working-directory: upstream/lx-music-mobile-auto-source
        run: npm run test:custom-sources

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Android TV manifest
        run: |
          python3 scripts/prepare-android-tv.py
          python3 scripts/patch-tv-controls.py
          python3 scripts/patch-lx-tv-polish.py
          python3 scripts/patch-lx-tv-conversion-language-gate.py
          python3 scripts/patch-lx-tv-defaults.py
          python3 scripts/patch-lx-tv-remove-sync-settings.py
          python3 scripts/patch-lx-tv-remove-error-log-settings.py
          grep -n "LEANBACK_LAUNCHER\\|android.software.leanback\\|screenOrientation" upstream/lx-music-mobile-auto-source/android/app/src/main/AndroidManifest.xml

      - name: Generate Android JS bundle
        working-directory: upstream/lx-music-mobile-auto-source
        run: npm run bundle-android

      - name: Assemble debug APK
        working-directory: upstream/lx-music-mobile-auto-source/android
        run: |
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew --no-daemon --refresh-dependencies -PreactNativeArchitectures=x86,x86_64 assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency/build attempt failed; retrying in 20 seconds."
              sleep 20
            fi
          done
          exit 1

      - name: Package complete source tree
        run: |
          mkdir -p dist
          zip -qr dist/lx-music-tv-source.zip . \
            -x './.git/*' './**/.git/*' './**/node_modules/*' \
               './**/build/*' './**/.gradle/*' './dist/*'

      - name: Upload APK - x86
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-x86
          path: upstream/lx-music-mobile-auto-source/android/app/build/outputs/apk/debug/*x86.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK - x86_64
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-x86_64
          path: upstream/lx-music-mobile-auto-source/android/app/build/outputs/apk/debug/*x86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-universal
          path: upstream/lx-music-mobile-auto-source/android/app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-source
          path: dist/lx-music-tv-source.zip
          if-no-files-found: error
          retention-days: 30
