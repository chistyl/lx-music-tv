name: LX Music TV native Android build

on:
  push:
    branches:
      - feature/lx-mobile-auto-source-tv-r1
      - feature/lx-tv-layout-fix-run101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37"
          yes | sdkmanager --licenses

      - name: Verify Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build native Android TV APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package complete native source
        run: |
          mkdir -p dist
          zip -qr dist/lx-music-tv-source.zip . \
            -x './.git/*' './**/.git/*' './**/build/*' './**/.gradle/*' \
               './**/node_modules/*' './dist/*'

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-universal
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-source
          path: dist/lx-music-tv-source.zip
          if-no-files-found: error
          retention-days: 30
