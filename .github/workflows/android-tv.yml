name: Android TV build

on:
  push:
    branches:
      - feature/lx-mobile-auto-source-tv-r1
      - feature/lx-tv-layout-run100
      - fix/lx-tv-theme-player-controls-run117
      - fix/lx-tv-player-spacing-theme-run130
      - fix/lx-tv-polish-run133
      - fix/lx-tv-default-language-source-name-run135
      - fix/lx-tv-remove-sync-settings-run136
      - fix/lx-tv-remove-error-log-settings-run137
      - fix/lx-tv-traditional-conversion-language-only-run138
      - fix/lx-tv-theme-nav-black-bg-run139
      - fix/lx-tv-nav-proportions-run146
      - fix/lx-tv-nav-compact-selected-icons-run151
      - fix/lx-tv-nav-tile-compact-run153
      - fix/lx-tv-remove-source-quick-add-run154
      - fix/lx-tv-quickbase64-arm-abi-run239
      - feature/lx-tv-full-tv-ui-run260
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LX Music TV project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Compile and assemble native Android TV app
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package complete source tree
        run: |
          mkdir -p dist
          zip -qr dist/lx-music-tv-source.zip . \
            -x './.git/*' './**/.git/*' './**/node_modules/*' \
               './**/build/*' './**/.gradle/*' './dist/*'

      - name: Upload APK - armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK - arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK - x86
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-x86
          path: app/build/outputs/apk/debug/*x86-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK - x86_64
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-x86_64
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-apk-universal
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-source
          path: dist/lx-music-tv-source.zip
          if-no-files-found: error
          retention-days: 30
